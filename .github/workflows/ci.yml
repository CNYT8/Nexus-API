name: Code checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Dual frontend and Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      NODE_OPTIONS: '--max-old-space-size=4096'
      CI: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Version and frozen dependencies
        run: |
          bash bin/check-version-sync.sh
          bun install --cwd web --frozen-lockfile

      - name: Check changed source formatting and lint through stdin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          base = os.environ.get('BASE_SHA', '')
          if not base or set(base) == {'0'}:
              base = subprocess.check_output(['git', 'rev-list', '--max-parents=0', 'HEAD'], text=True).splitlines()[0]
          subprocess.run(['git', 'diff', '--check', base, 'HEAD'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--diff-filter=ACMR', '--name-only', '-z', base, 'HEAD']).decode().split('\0')
          failed = False
          for name in filter(None, paths):
              source = root / name
              if not source.is_file():
                  continue
              data = source.read_bytes()
              if source.suffix == '.go':
                  result = subprocess.run(['gofmt'], input=data, capture_output=True)
                  if result.returncode or result.stdout != data:
                      print(f'Go formatting failed: {name}', file=sys.stderr)
                      print(result.stderr.decode(), file=sys.stderr)
                      failed = True
              parts = pathlib.PurePosixPath(name).parts
              if len(parts) < 3 or parts[0] != 'web' or parts[1] not in ('default', 'classic'):
                  continue
              if source.suffix not in ('.js', '.jsx', '.ts', '.tsx', '.json', '.css'):
                  continue
              frontend = root / 'web' / parts[1]
              relative = str(source.relative_to(frontend))
              prettier = frontend / 'node_modules/.bin/prettier'
              result = subprocess.run(['node', str(prettier), '--stdin-filepath', relative], cwd=frontend, input=data, capture_output=True)
              if result.returncode or result.stdout != data:
                  print(f'Frontend formatting failed: {name}', file=sys.stderr)
                  print(result.stderr.decode(), file=sys.stderr)
                  failed = True
              extensions = ('.js', '.jsx', '.ts', '.tsx') if parts[1] == 'default' else ('.js', '.jsx')
              if source.suffix in extensions:
                  eslint = frontend / 'node_modules/.bin/eslint'
                  result = subprocess.run(['node', str(eslint), '--stdin', '--stdin-filename', relative], cwd=frontend, input=data)
                  failed |= result.returncode != 0
          sys.exit(1 if failed else 0)
          PY

      - name: Default frontend typecheck
        working-directory: web/default
        run: bun run typecheck

      - name: Frontend billing expression parity checks
        run: node bin/test-frontend-time-rules.cjs

      # Build serially on GitHub runners. Both real outputs are required by go:embed.
      - name: Build default frontend
        working-directory: web/default
        run: |
          export VITE_REACT_APP_VERSION="$(tr -d '[:space:]' < ../../VERSION)"
          bun run build
          test -s dist/index.html

      - name: Build classic frontend
        working-directory: web/classic
        run: |
          export VITE_REACT_APP_VERSION="$(tr -d '[:space:]' < ../../VERSION)"
          bun run build
          test -s dist/index.html

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test -p 2 -count=1 -timeout=15m ./...

      - name: Ensure dependency manifests stayed frozen
        run: git diff --exit-code -- go.mod go.sum web/package.json web/bun.lock web/default/package.json web/classic/package.json
