name: Build Electron App

on:
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read

concurrency:
  group: electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      CGO_ENABLED: '0'
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Resolve checked-in version
        run: |
          set -euo pipefail
          bash bin/check-version-sync.sh
          NEXUS_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$NEXUS_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          printf 'NEXUS_VERSION=%s\n' "$NEXUS_VERSION" >> "$GITHUB_ENV"

      - name: Install frozen frontend workspace
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build both embedded frontends serially
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          set -euo pipefail
          export VITE_REACT_APP_VERSION="$NEXUS_VERSION"
          (cd web/default && bun run build)
          (cd web/classic && bun run build)
          test -s web/default/dist/index.html
          test -s web/classic/dist/index.html

      - name: Build Go binary (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          go mod download
          go build -ldflags "-s -w -X github.com/QuantumNous/new-api/common.Version=$NEXUS_VERSION" -o new-api

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        run: |
          go mod download
          go build -ldflags "-s -w -X github.com/QuantumNous/new-api/common.Version=$NEXUS_VERSION" -o new-api.exe

      - name: Install frozen Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Electron app (macOS)
        if: runner.os == 'macOS'
        working-directory: electron
        run: npm run build:mac -- --publish never --config.extraMetadata.version="${NEXUS_VERSION#v}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # Skip code signing

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        working-directory: electron
        # Override packaged metadata without changing package.json/package-lock.json.
        run: npm run build:win -- --publish never --config.extraMetadata.version="${NEXUS_VERSION#v}"

      - name: Build Electron app (Linux)
        if: runner.os == 'Linux'
        working-directory: electron
        run: npm run build:linux -- --publish never --config.extraMetadata.version="${NEXUS_VERSION#v}"

      - name: Ensure dependency manifests stayed frozen
        run: git diff --exit-code -- go.mod go.sum web/bun.lock web/package.json web/default/package.json web/classic/package.json electron/package.json electron/package-lock.json

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build
          if-no-files-found: error
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          if-no-files-found: error
          path: |
            electron/dist/*.exe

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build
          if-no-files-found: error
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Upload to Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            macos-build/*
            windows-build/*
            linux-build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}