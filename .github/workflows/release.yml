name: Release (Linux, macOS, Windows)

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
        type: string

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Read VERSION once and validate selected tag
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          bash bin/check-version-sync.sh "$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "$version" ]]; then
            echo '::error::Selected tag must match VERSION'
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'sha=%s\nversion=%s\n' "$sha" "$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build binaries (${{ matrix.os }})
    needs: [prepare]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VITE_REACT_APP_VERSION: ${{ needs.prepare.outputs.version }}
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2 -mod=readonly'
      GOTOOLCHAIN: local
      NODE_OPTIONS: '--max-old-space-size=4096'
      CI: ''
    steps:
      - name: Check out prepared commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.2'

      - name: Set up Go from the exact repository version
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Install frozen frontend workspace
        run: bun install --cwd web --frozen-lockfile

      - name: Build Frontend (default)
        working-directory: web/default
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
        run: |
          bun run build
          test -s dist/index.html

      - name: Build Frontend (classic)
        working-directory: web/classic
        run: |
          bun run build
          test -s dist/index.html

      - name: Prepare artifact directory
        run: mkdir -p release-assets

      - name: Build Linux Backend (amd64)
        if: matrix.os == 'linux'
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o "release-assets/new-api-$VERSION"

      - name: Build Linux Backend (arm64)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o "release-assets/new-api-arm64-$VERSION"

      - name: Build macOS Backend
        if: matrix.os == 'macos'
        run: |
          go build -ldflags "-X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o "release-assets/new-api-macos-$VERSION"

      - name: Build Windows Backend
        if: matrix.os == 'windows'
        run: |
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o "release-assets/new-api-$VERSION.exe"

      - name: Generate checksums
        working-directory: release-assets
        env:
          TARGET_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          case "$TARGET_OS" in
            linux) sha256sum "new-api-$VERSION" "new-api-arm64-$VERSION" > checksums-linux.txt ;;
            macos) shasum -a 256 "new-api-macos-$VERSION" > checksums-macos.txt ;;
            windows) sha256sum "new-api-$VERSION.exe" > checksums-windows.txt ;;
            *) exit 1 ;;
          esac

      - name: Ensure dependency manifests stayed frozen
        run: git diff --exit-code -- go.mod go.sum web/package.json web/bun.lock web/default/package.json web/classic/package.json

      - name: Upload binaries and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-binaries-${{ matrix.os }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish verified binaries for the selected tag
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Same-run artifacts only; the publishing job does not execute source code.
      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nexus-binaries-*
          path: release-assets
          merge-multiple: true

      - name: Verify checksums for all three platforms
        working-directory: release-assets
        run: |
          set -euo pipefail
          for platform in linux macos windows; do
            sha256sum --check "checksums-$platform.txt"
          done

      - name: Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            release-assets/new-api-*
            release-assets/checksums-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
